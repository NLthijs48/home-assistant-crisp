rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not provide any actions.
  appropriate-polling:
    status: done
    comment: The coordinator polls the Crisp cloud API every 15 minutes.
  brands:
    status: done
    comment: Brand images are provided in the `brand` folder.
  common-modules:
    status: done
    comment: Shared logic lives in `coordinator.py` and `entity.py`.
  config-flow-test-coverage:
    status: done
    comment: The config flow, including reauthentication, is fully covered by tests in `tests/test_config_flow.py`.
  config-flow:
    status: done
    comment: Config flow with email/login code and reauthentication.
  dependency-transparency:
    status: exempt
    comment: No external libraries are used; the API is accessed through Home Assistant's aiohttp session.
  docs-actions:
    status: exempt
    comment: The integration does not provide any actions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  entity-event-setup:
    status: exempt
    comment: Entities are coordinator-based and do not subscribe to events.
  entity-unique-id:
    status: done
    comment: Unique ID is `<account id>.<entity key>`.
  has-entity-name:
    status: done
    comment: Base entity sets `_attr_has_entity_name = True`.
  runtime-data:
    status: done
    comment: The coordinator is stored in `entry.runtime_data`.
  test-before-configure:
    status: done
    comment: The login is verified against the Crisp API during the config flow.
  test-before-setup:
    status: done
    comment: Setup performs `async_config_entry_first_refresh`.
  unique-config-entry:
    status: done
    comment: The unique ID is the Crisp user id; duplicates are aborted.

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not provide any actions.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads the integration's platforms.
  docs-configuration-parameters:
    status: exempt
    comment: The integration does not provide an options flow.
  docs-installation-parameters:
    status: done
    comment: The README's setup instructions document the country, email, and login code required during setup.
  entity-unavailable:
    status: done
    comment: Coordinator-based entities expose coordinator availability, and platforms combine it with super().available.
  integration-owner:
    status: done
    comment: The integration has an owner listed in CODEOWNERS (@NLthijs48).
  log-when-unavailable:
    status: done
    comment: The coordinator reports update failures through UpdateFailed, which Home Assistant logs and reports when the integration is unavailable.
  parallel-updates:
    status: done
    comment: All platforms set PARALLEL_UPDATES = 0 because updates are centralized in the coordinator.
  reauthentication-flow:
    status: done
    comment: The config flow supports reauthentication and raises ConfigEntryAuthFailed when credentials are invalid.
  test-coverage:
    status: todo
    comment: Add tests for __init__.py, coordinator.py, and the platform modules; achieve more than 95% test coverage.
